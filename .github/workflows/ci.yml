name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # 命例延迟加载、答案隔离和导出引用必须在真实浏览器验收；脚本包含生产构建。
      - run: npm run e2e:cases
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cases-playwright-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
